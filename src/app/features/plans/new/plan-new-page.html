<div class="page">
  <a class="back" routerLink="/plans">
    <i class="pi pi-arrow-left" aria-hidden="true"></i>
    {{ 'plans.backToList' | transloco }}
  </a>
  <header class="page__header">
    <h2 class="page__title">{{ 'editor.newPlan.title' | transloco }}</h2>
    <p class="page__subtitle">{{ 'editor.newPlan.subtitle' | transloco }}</p>
  </header>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span class="field__label">{{ 'editor.plan.name' | transloco }}</span>
      <input pInputText type="text" formControlName="name" maxlength="60" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field__error">{{ 'form.required' | transloco }}</span>
      }
    </label>

    <label class="field">
      <span class="field__label">{{ 'editor.plan.fase' | transloco }}</span>
      <input pInputText type="number" inputmode="numeric" min="1" formControlName="fase" />
      <span class="field__hint">{{ 'editor.plan.faseHint' | transloco }}</span>
      @if (form.controls.fase.touched && form.controls.fase.invalid) {
        <span class="field__error">{{ 'form.min' | transloco: { min: 1 } }}</span>
      }
    </label>

    <label class="check">
      <input type="checkbox" formControlName="activate" />
      <span>
        <span class="check__label">{{ 'import.activate' | transloco }}</span>
        <span class="check__hint">{{ 'import.activateHint' | transloco }}</span>
      </span>
    </label>

    <div class="page__actions">
      <button pButton type="submit" [disabled]="busy()">
        <i class="pi pi-check" pButtonIcon aria-hidden="true"></i>
        <span pButtonLabel>{{ 'editor.newPlan.create' | transloco }}</span>
      </button>
    </div>
  </form>
</div>
